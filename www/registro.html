<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Crear cuenta — DeliveryMap</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: linear-gradient(135deg, #080d1a 0%, #0a1128 50%, #080d1a 100%);
      color: #ffffff;
      font-family: sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
    }
    .container {
      width: 100%;
      max-width: 380px;
      background: rgba(8,20,60,0.85);
      border: 1px solid rgba(30,144,255,0.8);
      box-shadow: 0 0 25px rgba(30,144,255,0.25);
      border-radius: 12px;
      padding: 32px 24px;
    }
    .logo {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 3px;
      color: #ff00cc;
      text-shadow: 0 0 10px #ff00cc;
      text-align: center;
      margin-bottom: 4px;
    }
    .logo span { color: #4a90e2; }
    .subtitulo {
      font-size: 11px;
      color: #ff00cc;
      letter-spacing: 2px;
      text-align: center;
      margin-bottom: 40px;
    }
    h1 {
      font-size: 20px;
      color: white;
      margin-bottom: 24px;
      text-align: center;
    }
    label {
      display: block;
      font-size: 12px;
      color: #4da6ff;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      background: rgba(10,25,60,0.6);
      border: 1px solid rgba(30,144,255,0.2);
      border-radius: 8px;
      color: #ffffff;
      font-size: 15px;
      padding: 12px 14px;
      outline: none;
      margin-bottom: 16px;
      transition: border 0.2s, box-shadow 0.2s;
    }
    input:focus { border-color: #1e90ff; box-shadow: 0 0 10px rgba(30,144,255,0.4); }
    input::-webkit-input-placeholder { color: rgba(255,255,255,0.6) !important; }
    input::-moz-placeholder { color: rgba(255,255,255,0.6) !important; opacity: 1; }
    input::placeholder { color: rgba(255,255,255,0.6) !important; }
    .btn-primary {
      width: 100%;
      padding: 14px;
      background: linear-gradient(90deg, #0047cc, #0066ff);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-bottom: 12px;
      box-shadow: 0 0 15px rgba(0,102,255,0.4);
    }
    .btn-primary:active { opacity: 0.8; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-google {
      width: 100%;
      padding: 13px;
      background: rgba(10,25,60,0.6);
      color: #ffffff;
      border: 1px solid rgba(30,144,255,0.3);
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .btn-google:active { opacity: 0.8; }
    .separador {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .separador hr {
      flex: 1;
      border: none;
      border-top: 1px solid rgba(30,144,255,0.2);
    }
    .separador span { font-size: 12px; color: rgba(255,255,255,0.3); }
    .mensaje {
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      text-align: center;
      margin-bottom: 16px;
      display: none;
      line-height: 1.5;
    }
    .mensaje.error { background: #2e0f0f; color: #f44336; border: 1px solid #5c2a2a; }
    .mensaje.exito { background: #0f2e1a; color: #4caf50; border: 1px solid #2a5c35; }
    .hint {
      font-size: 12px;
      color: rgba(255,255,255,0.6);
      margin-top: -12px;
      margin-bottom: 16px;
      line-height: 1.5;
    }
    .terminos {
      font-size: 12px;
      color: rgba(255,255,255,0.7);
      text-align: center;
      margin-bottom: 20px;
      line-height: 1.6;
    }
    .terminos a { color: #4da6ff; text-decoration: none; }
    .links {
      text-align: center;
      font-size: 13px;
      color: rgba(255,255,255,0.7);
    }
    .links a { color: #4da6ff; text-decoration: none; }
    .volver {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #4da6ff;
      text-decoration: none;
      font-size: 13px;
    }
  </style>
  <script defer src="https://cloud.umami.is/script.js" data-website-id="568d65a7-876b-405a-a4b2-3b6a35d3d8f9"></script>
<body>
<div class="container">

  <div class="logo">DELIVERY<span>MAP</span></div>
  <div class="subtitulo">// CHILE DELIVERY NETWORK //</div>

  <h1>Crear cuenta</h1>

  <div id="mensaje" class="mensaje"></div>

  <label for="apodo">Apodo o nombre</label>
  <input type="text" id="apodo" placeholder="Ej: El Turbo, Rider123" maxlength="30" autocomplete="off"/>
  <p class="hint">Así te verán otros riders. Puedes usar un apodo.</p>

  <label for="email">Email</label>
  <input type="email" id="email" placeholder="tu@email.com" autocomplete="email"/>

  <label for="password">Contraseña</label>
  <input type="password" id="password" placeholder="Mínimo 6 caracteres" autocomplete="new-password"/>

  <label for="password2">Confirmar contraseña</label>
  <input type="password" id="password2" placeholder="Repite la contraseña" autocomplete="new-password"
    onkeyup="if(event.key==='Enter') registrarse()"/>

  <div class="terminos">
    Al crear una cuenta aceptas nuestros<br>
    <a href="terminos.html" target="_blank">Términos de uso y Política de Privacidad</a>
  </div>

  <button class="btn-primary" id="btnRegistro" onclick="registrarse()">Crear cuenta</button>

  <div class="separador">
    <hr/><span>o</span><hr/>
  </div>

  <button class="btn-google" onclick="loginGoogle()">
    <svg width="18" height="18" viewBox="0 0 24 24">
      <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
      <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
    </svg>
    Registrarse con Google
  </button>

  <div class="links">
    ¿Ya tienes cuenta? <a href="login.html">Iniciar sesión</a>
  </div>

  <a class="volver" href="app.html">← Volver al mapa</a>

</div>

<script>
const SUPABASE_URL = 'https://zxwwffnjrrkmtsxzvswa.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp4d3dmZm5qcnJrbXRzeHp2c3dhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3MDU2MzksImV4cCI6MjA5NjI4MTYzOX0.0rCwuo78dkvJ-C6Y3br3s7ZuPpdikakxC21WO4dv_rI';

async function registrarse() {
  const apodo    = document.getElementById('apodo').value.trim();
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const password2 = document.getElementById('password2').value;
  const btn      = document.getElementById('btnRegistro');

  if (!email || !password || !password2) {
    mostrarMensaje('Completa todos los campos.', 'error');
    return;
  }
  if (password.length < 6) {
    mostrarMensaje('La contraseña debe tener al menos 6 caracteres.', 'error');
    return;
  }
  if (password !== password2) {
    mostrarMensaje('Las contraseñas no coinciden.', 'error');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Creando cuenta...';

  let apodoFinal = apodo;
  if (!apodo) {
    const resApodo = await fetch(`${SUPABASE_URL}/rest/v1/rpc/incrementar_delivery_num`, {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({})
    });
    apodoFinal = await resApodo.json();
  }

  const res = await fetch(`${SUPABASE_URL}/auth/v1/signup`, {
    method: 'POST',
    headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password, data: { apodo: apodoFinal } })
  });

  const data = await res.json();

 if (res.ok) {
    mostrarMensaje(`✅ Cuenta creada como "${apodoFinal}". Revisa tu email para confirmar y luego inicia sesión.`, 'exito');
    btn.textContent = 'Crear cuenta';
    btn.disabled = false;
  } else {
    const errMsg = data.msg || data.error_description || 'Error al crear la cuenta.';
    mostrarMensaje(errMsg, 'error');
    btn.disabled = false;
    btn.textContent = 'Crear cuenta';
  }
}

function loginGoogle() {
  window.location.href = `${SUPABASE_URL}/auth/v1/authorize?provider=google&redirect_to=https://deliverymap.cl/app.html`;
}

function mostrarMensaje(texto, tipo) {
  const msg = document.getElementById('mensaje');
  msg.textContent = texto;
  msg.className = `mensaje ${tipo}`;
  msg.style.display = 'block';
}
</script>
</body>
</html>
