<script>

// SPLASH
if (sessionStorage.getItem('nosplash')) {
  sessionStorage.removeItem('nosplash');
  document.getElementById('splash').style.display = 'none';
} else {
const splashCanvas = document.getElementById('splash-canvas');
const splashCtx = splashCanvas.getContext('2d');
splashCanvas.width = window.innerWidth;
splashCanvas.height = window.innerHeight;

const NUM_POINTS = 70;
const splashPoints = [];
for (let i = 0; i < NUM_POINTS; i++) {
const esMagenta = Math.random() > 0.5;
splashPoints.push({
    x: Math.random() * splashCanvas.width,
    y: Math.random() * splashCanvas.height,
    r: Math.random() * 2 + 1.5,
    color: esMagenta ? '255,0,204' : '74,144,226',
    apareceEn: Math.random() * 0.7,
    fadeSpeed: 0.06 + Math.random() * 0.10
  });
}

let splashStart = null;
const SPLASH_TOTAL = 900;

function drawSplash(ts) {
  if (!splashStart) splashStart = ts;
  const t = (ts - splashStart) / SPLASH_TOTAL;

  splashCtx.clearRect(0, 0, splashCanvas.width, splashCanvas.height);

  const pulsePhase  = Math.min(1, Math.max(0, (t - 0.7)  / 0.2));
  const fadeOut     = Math.min(1, Math.max(0, (t - 1.3)  / 0.15));

  // Líneas
  for (let i = 0; i < splashPoints.length; i++) {
    for (let j = i + 1; j < splashPoints.length; j++) {
      const dx = splashPoints[i].x - splashPoints[j].x;
      const dy = splashPoints[i].y - splashPoints[j].y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < 99999) {
        const lineDelay = Math.max(splashPoints[i].apareceEn, splashPoints[j].apareceEn);
const lineProgress2 = Math.min(1, Math.max(0, (t - lineDelay - 0.05) / 0.25));
const alpha = lineProgress2 * (1 - dist/220) * 0.35 * (1 - fadeOut);
        splashCtx.beginPath();
        splashCtx.moveTo(splashPoints[i].x, splashPoints[i].y);
        splashCtx.lineTo(splashPoints[j].x, splashPoints[j].y);
        const lineColor = splashPoints[i].color === splashPoints[j].color
  ? splashPoints[i].color : '136,0,255';
splashCtx.strokeStyle = `rgba(${lineColor},${alpha})`;
        splashCtx.lineWidth = 0.8;
        splashCtx.stroke();
      }
    }
  }

  // Puntos
  splashPoints.forEach((p, i) => {
    const pAlpha = Math.min(1, Math.max(0, (t - p.apareceEn) / p.fadeSpeed)) * (1 - fadeOut);

    if (pulsePhase > 0) {
      const pulseR = p.r + pulsePhase * 12;
      const pulseA = (1 - pulsePhase) * 0.25 * pAlpha;
      splashCtx.beginPath();
      splashCtx.arc(p.x, p.y, pulseR, 0, Math.PI * 2);
      splashCtx.fillStyle = `rgba(${p.color},${pulseA})`;
      splashCtx.fill();
    }

    splashCtx.beginPath();
    splashCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    splashCtx.fillStyle = `rgba(${p.color},${pAlpha})`;
splashCtx.shadowColor = p.color === '255,0,204' ? '#ff00cc' : '#4a90e2';
    splashCtx.shadowBlur = 8;
    splashCtx.fill();
    splashCtx.shadowBlur = 0;
  });

  if (t < 1.5) {
    requestAnimationFrame(drawSplash);
  } else {
    const splash = document.getElementById('splash');
    splash.style.opacity = '0';
    setTimeout(() => {
      splash.style.display = 'none';
      setTimeout(() => mapa.invalidateSize(), 100);
    }, 500);
  }
}

  requestAnimationFrame(drawSplash);
}

function haversine(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const dLat = (lat2-lat1)*Math.PI/180;
  const dLng = (lng2-lng1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function formatDist(km) {

const sheet = document.getElementById('bottomSheet');
let startY = 0;
let currentY = 0;
let isDragging = false;
const MEDIO = window.innerHeight * 0.35;

sheet.style.bottom = '0';
sheet.style.transform = `translateY(${window.innerHeight}px)`;

function onStart(y) {
  isDragging = true;
  startY = y;
  sheet.style.transition = 'none';
}

function onMove(y) {
  if (!isDragging) return;
  const dy = y - startY;
  const newY = Math.min(window.innerHeight * 0.88, Math.max(0, currentY + dy));
  requestAnimationFrame(() => {
    sheet.style.transform = `translateY(${newY}px)`;
  });
}

function onEnd(y) {
  if (!isDragging) return;
  isDragging = false;
  const dy = y - startY;
  const newY = Math.min(window.innerHeight * 0.88, Math.max(0, currentY + dy));
  sheet.style.transition = 'transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94)';

  if (newY < window.innerHeight * 0.15) {
    currentY = 0;
  } else if (newY > window.innerHeight * 0.75) {
    currentY = window.innerHeight * 0.88;
    setTimeout(cerrarSheet, 350);
  } else {
    currentY = newY;
  }
  sheet.style.transform = `translateY(${currentY}px)`;
}

sheet.addEventListener('touchstart', e => {
  if (e.target.closest('#btnCerrarX')) return;
  onStart(e.touches[0].clientY);
}, { passive: true });

sheet.addEventListener('touchmove', e => {
  if (!isDragging) return;
  e.stopPropagation();
  onMove(e.touches[0].clientY);
}, { passive: false });

sheet.addEventListener('touchend', e => onEnd(e.changedTouches[0].clientY));

sheet.addEventListener('mousedown', e => {
  if (e.target.closest('#btnCerrarX')) return;
  onStart(e.clientY);
});

document.addEventListener('mousemove', e => { if (isDragging) onMove(e.clientY); });
document.addEventListener('mouseup', e => { if (isDragging) onEnd(e.clientY); });

            method: 'POST',

            localStorage.setItem('dm_user', JSON.stringify(newData.user));

async function cargarLikesYComentarios(localId) {
  const token = localStorage.getItem('dm_token');
  const user = localStorage.getItem('dm_user');
  const userId = user ? JSON.parse(user).id : null;
  // LIKES
  const resLikes = await supaFetch(
    `${SUPABASE_URL}/rest/v1/likes?local_id=eq.${pg(localId)}&select=id,user_id,tipo`,
    { headers: { 'Accept': 'application/json' }}
  );
  const likesRaw = await resLikes.json();
  const likes = resLikes.ok && Array.isArray(likesRaw) ? likesRaw : [];
  const totalLikes = likes.filter(l => l.tipo === 'like').length;
  const totalDislikes = likes.filter(l => l.tipo === 'dislike').length;
  document.getElementById('contLikes').textContent = totalLikes;
  document.getElementById('contDislikes').textContent = totalDislikes;

  const btnLike = document.getElementById('btnLike');
  const btnDislike = document.getElementById('btnDislike');
  btnLike.className = 'like-btn';
  btnDislike.className = 'like-btn';
  if (userId) {
    const propio = likes.find(l => l.user_id === userId);
    if (propio?.tipo === 'like') btnLike.className = 'like-btn activo-like';
    if (propio?.tipo === 'dislike') btnDislike.className = 'like-btn activo-dislike';
  }

  // COMENTARIOS
  const resComent = await supaFetch(
    `${SUPABASE_URL}/rest/v1/comentarios?local_id=eq.${pg(localId)}&order=creado_en.desc&select=id,user_id,apodo,texto,creado_en`,
    { headers: { 'Accept': 'application/json' }}
  );
  const comentariosRaw = await resComent.json();
  const comentarios = resComent.ok && Array.isArray(comentariosRaw) ? comentariosRaw : [];
  const lista = document.getElementById('listaComentarios');
  const fotosPorUsuario = new Map();
  const apodoPorUsuario = new Map();

  // Cargar likes/dislikes de todos los comentarios en batch
  const likesMapComent = new Map();
  if (comentarios.length > 0) {
    const ids = comentarios.map(c => pg(c.id)).join(',');
    const resComentLikes = await supaFetch(
      `${SUPABASE_URL}/rest/v1/comentario_likes?comentario_id=in.(${ids})&select=comentario_id,user_id,tipo`,
      { headers: { 'Accept': 'application/json' }}
    );
    const comentLikesRaw = await resComentLikes.json();
    const comentLikes = resComentLikes.ok && Array.isArray(comentLikesRaw) ? comentLikesRaw : [];
    comentarios.forEach(c => {
      const votes = comentLikes.filter(l => l.comentario_id === c.id);
      const mio = votes.find(l => l.user_id === userId);
      likesMapComent.set(c.id, {
        likes: votes.filter(l => l.tipo === 'like').length,
        dislikes: votes.filter(l => l.tipo === 'dislike').length,
        mioTipo: mio ? mio.tipo : null
      });
    });
  }

  if (comentarios.length > 0) {
    const userIds = [...new Set(comentarios.map(c => c.user_id).filter(Boolean))];
    if (userIds.length > 0) {
      const resPerfiles = await supaFetch(
        `${SUPABASE_URL}/rest/v1/perfiles?user_id=in.(${userIds.map(pg).join(',')})&select=user_id,foto_url,apodo`,
        { headers: { 'Accept': 'application/json' }}
      );
      const perfilesRaw = await resPerfiles.json();
      const perfiles = resPerfiles.ok && Array.isArray(perfilesRaw) ? perfilesRaw : [];
      perfiles.forEach(p => {
        const fotoUrl = safeImageUrl(p.foto_url);
        if (fotoUrl) fotosPorUsuario.set(p.user_id, fotoUrl);
        apodoPorUsuario.set(p.user_id, p.apodo ?? null);
      });
    }
  }

  if (comentarios.length === 0) {
    lista.innerHTML = '<div class="sin-comentarios">Sin comentarios aún. ¡Sé el primero!</div>';
  } else {
    lista.innerHTML = comentarios.map(c => {
      const esPropio = userId && c.user_id === userId;
      const fotoUrl = fotosPorUsuario.get(c.user_id);
      const apodoMostrado = apodoPorUsuario.get(c.user_id) ?? c.apodo ?? 'Rider';
      const inicial = esc(apodoMostrado.charAt(0));
      const avatarHtml = fotoUrl
        ? `<img src="${fotoUrl}" alt="${esc(apodoMostrado)}">`
        : inicial;
      const lk = likesMapComent.get(c.id) || { likes: 0, dislikes: 0, mioTipo: null };
      const canVote = !!(token && userId);
      const likeActivo = lk.mioTipo === 'like' ? ' activo-like' : '';
      const dislikeActivo = lk.mioTipo === 'dislike' ? ' activo-dislike' : '';
      const voteDisabled = canVote ? '' : ' disabled';
      return `
        <div class="comentario-item" id="comentario-${c.id}">
          <div class="comentario-avatar">${avatarHtml}</div>
          <div class="comentario-body">
          <div class="comentario-apodo" style="cursor:pointer;" data-uid="${esc(c.user_id)}" onclick="(function(el){ const u = localStorage.getItem('dm_user'); const me = u ? JSON.parse(u).id : null; window.location.href = (me === el.dataset.uid) ? 'perfil.html' : 'perfil-publico.html?id='+el.dataset.uid; })(this)">${esc(apodoMostrado)}</div>
          <div class="comentario-texto">${esc(c.texto)}</div>
          <div class="comentario-footer">
            <span class="comentario-fecha">${tiempoTranscurrido(c.creado_en)}</span>
            <div class="comentario-acciones">
              <button class="coment-like-btn${likeActivo}"${voteDisabled} data-tipo="like" onclick="toggleComentarioLike(${c.id},'like')">👍 <span class="coment-like-count">${lk.likes}</span></button>
              <button class="coment-like-btn${dislikeActivo}"${voteDisabled} data-tipo="dislike" onclick="toggleComentarioLike(${c.id},'dislike')">👎 <span class="coment-like-count">${lk.dislikes}</span></button>
              ${esPropio
                ? `<button class="btn-comentario-accion btn-borrar-comentario" onclick="borrarComentario(${c.id})">🗑 Borrar</button>`
                : `<button class="btn-comentario-accion btn-reportar-comentario" data-apodo="${esc(c.apodo)}" onclick="reportarComentario(${c.id}, this.dataset.apodo)">⚑ Reportar</button>`
              }
            </div>
          </div>
          </div>
        </div>`;
    }).join('');
  }

  // INPUT COMENTARIO
  const inputWrap = document.getElementById('comentarioInput');
  if (token && userId) {
    inputWrap.innerHTML = `
      <div class="comentario-input-wrap">
        <input id="inputComentario" type="text" placeholder="Escribe un comentario..." maxlength="200" />
        <button id="btnEnviarComentario" onclick="enviarComentario(${localId})">Enviar</button>
      </div>`;
  } else {
    inputWrap.innerHTML = `<div class="login-para-comentar"><a href="login.html">Inicia sesión</a> para comentar</div>`;
  }
}

async function toggleLike(tipo) {
  const token = localStorage.getItem('dm_token');
  const userStr = localStorage.getItem('dm_user');
  
  if (!token || !userStr) {
    window.location.href = 'login.html';
    return;
  }

  const ahora = Date.now();
  if (ahora - ultimoLikeTs < 2000) {
    mostrarToast('Espera un momento entre likes', 'error');
    return;
  }
  ultimoLikeTs = ahora;

  const btnLike = document.getElementById('btnLike');
  const btnDislike = document.getElementById('btnDislike');
  btnLike.disabled = true;
  btnDislike.disabled = true;
  setTimeout(() => { btnLike.disabled = false; btnDislike.disabled = false; }, 2000);

  const user = JSON.parse(userStr);
  const localId = localActivo.id;

  const resCheck = await supaFetch(
    `${SUPABASE_URL}/rest/v1/likes?local_id=eq.${pg(localId)}&user_id=eq.${pg(user.id)}&select=id,tipo`,
    { headers: { 'Accept': 'application/json' }}
  );
  
  if (!resCheck.ok) {
    mostrarToast('No se pudo leer la reacción', 'error');
    return;
  }
  
  const existing = await resCheck.json();
  let mensajeOk = tipo === 'like' ? 'Like guardado' : 'Dislike guardado';

  if (existing.length > 0) {
    const resDel = await supaFetch(
      `${SUPABASE_URL}/rest/v1/likes?local_id=eq.${pg(localId)}&user_id=eq.${pg(user.id)}`,
      { method: 'DELETE' }
    );
    if (!resDel.ok) { mostrarToast('No se pudo actualizar la reacción', 'error'); return; }
    
    if (existing[0].tipo !== tipo) {
      const resIns = await supaFetch(`${SUPABASE_URL}/rest/v1/likes`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
        body: JSON.stringify({ local_id: localId, user_id: user.id, tipo })
      });
      if (!resIns.ok) { mostrarToast('No se pudo guardar la reacción', 'error'); return; }
    } else {
      mensajeOk = 'Reacción quitada';
    }
  } else {
    const resIns = await supaFetch(`${SUPABASE_URL}/rest/v1/likes`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
      body: JSON.stringify({ local_id: localId, user_id: user.id, tipo })
    });
    if (!resIns.ok) { mostrarToast('No se pudo guardar la reacción', 'error'); return; }
  }
  
  mostrarToast(mensajeOk, 'exito');
  cargarLikesYComentarios(localId);
}

async function toggleComentarioLike(comentarioId, tipo) {
  const token = localStorage.getItem('dm_token');
  const userStr = localStorage.getItem('dm_user');
  if (!token || !userStr) { window.location.href = 'login.html'; return; }
  const user = JSON.parse(userStr);

  const resCheck = await supaFetch(
    `${SUPABASE_URL}/rest/v1/comentario_likes?comentario_id=eq.${pg(comentarioId)}&user_id=eq.${pg(user.id)}&select=id,tipo`,
    { headers: { 'Accept': 'application/json' }}
  );
  const existing = await resCheck.json();
  let wasLikeAdded = false;

  if (Array.isArray(existing) && existing.length > 0) {
    await supaFetch(
      `${SUPABASE_URL}/rest/v1/comentario_likes?comentario_id=eq.${pg(comentarioId)}&user_id=eq.${pg(user.id)}`,
      { method: 'DELETE' }
    );
    if (existing[0].tipo !== tipo) {
      await supaFetch(`${SUPABASE_URL}/rest/v1/comentario_likes`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
        body: JSON.stringify({ comentario_id: comentarioId, user_id: user.id, tipo })
      });
      if (tipo === 'like') wasLikeAdded = true;
    }
  } else {
    await supaFetch(`${SUPABASE_URL}/rest/v1/comentario_likes`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
      body: JSON.stringify({ comentario_id: comentarioId, user_id: user.id, tipo })
    });
    if (tipo === 'like') wasLikeAdded = true;
  }

  if (wasLikeAdded) await checkLikesHito(comentarioId);
  await actualizarComentarioLikes(comentarioId, user.id);
}

async function checkLikesHito(comentarioId) {
  const resLikes = await supaFetch(
    `${SUPABASE_URL}/rest/v1/comentario_likes?comentario_id=eq.${pg(comentarioId)}&tipo=eq.like&select=id`,
    { headers: { 'Accept': 'application/json' }}
  );
  const likes = await resLikes.json();
  if (!Array.isArray(likes)) return;
  const total = likes.length;
  if (![5, 20, 50, 100].includes(total)) return;

  const resC = await supaFetch(
    `${SUPABASE_URL}/rest/v1/comentarios?id=eq.${pg(comentarioId)}&select=user_id`,
    { headers: { 'Accept': 'application/json' }}
  );
  const comentData = await resC.json();
  if (!Array.isArray(comentData) || !comentData[0]) return;
  const dueñoId = comentData[0].user_id;

  const localNombre = localActivo?.nombre || 'un local';
  const mensaje = `Tu comentario en ${localNombre} ha recibido ${total} likes`;
  const hitoTipo = `likes_hito_${comentarioId}`;

  if (total < 100) {
    await supaFetch(`${SUPABASE_URL}/rest/v1/notificaciones`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
      body: JSON.stringify({ user_id: dueñoId, tipo: hitoTipo, mensaje, leida: false })
    });
  } else {
    // 100 milestone: actualizar notificacion existente si ya hay una, si no insertar
    const resN = await supaFetch(
      `${SUPABASE_URL}/rest/v1/notificaciones?user_id=eq.${pg(dueñoId)}&tipo=eq.${pg(hitoTipo)}&select=id&order=id.desc&limit=1`,
      { headers: { 'Accept': 'application/json' }}
    );
    const notifs = await resN.json();
    if (Array.isArray(notifs) && notifs.length > 0) {
      await supaFetch(`${SUPABASE_URL}/rest/v1/notificaciones?id=eq.${pg(notifs[0].id)}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
        body: JSON.stringify({ mensaje, leida: false })
      });
    } else {
      await supaFetch(`${SUPABASE_URL}/rest/v1/notificaciones`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
        body: JSON.stringify({ user_id: dueñoId, tipo: hitoTipo, mensaje, leida: false })
      });
    }
  }
}

async function actualizarComentarioLikes(comentarioId, userId) {
  const resLikes = await supaFetch(
    `${SUPABASE_URL}/rest/v1/comentario_likes?comentario_id=eq.${pg(comentarioId)}&select=user_id,tipo`,
    { headers: { 'Accept': 'application/json' }}
  );
  const votes = await resLikes.json();
  if (!Array.isArray(votes)) return;

  const totalLikes = votes.filter(l => l.tipo === 'like').length;
  const totalDislikes = votes.filter(l => l.tipo === 'dislike').length;
  const mio = votes.find(l => l.user_id === userId);

  const el = document.getElementById(`comentario-${comentarioId}`);
  if (!el) return;
  const btnLike = el.querySelector('.coment-like-btn[data-tipo="like"]');
  const btnDislike = el.querySelector('.coment-like-btn[data-tipo="dislike"]');
  if (!btnLike || !btnDislike) return;

  btnLike.className = 'coment-like-btn' + (mio?.tipo === 'like' ? ' activo-like' : '');
  btnDislike.className = 'coment-like-btn' + (mio?.tipo === 'dislike' ? ' activo-dislike' : '');
  btnLike.querySelector('.coment-like-count').textContent = totalLikes;
  btnDislike.querySelector('.coment-like-count').textContent = totalDislikes;
}

async function enviarComentario(localId) {
  let user;
  try { user = JSON.parse(localStorage.getItem('dm_user')); } catch(e) { user = null; }
  if (!user) { mostrarToast('Inicia sesión para comentar', 'error'); return; }
  const apodo = user.user_metadata?.apodo || user.email?.split('@')[0] || 'Rider';
  const inputComentario = document.getElementById('inputComentario');
  const btnEnviar = document.getElementById('btnEnviarComentario');
  const texto = inputComentario.value.trim();
  if (!texto) return;

  const ahora = Date.now();
  const recientes = comentarioTimestamps.filter(ts => ahora - ts < 60000);
  if (recientes.length >= 3) {
    mostrarToast('Espera un momento antes de comentar de nuevo', 'error');
    return;
  }

  btnEnviar.disabled = true;
  btnEnviar.textContent = 'Enviando...';
  let resComent;
  try {
    resComent = await supaFetch(`${SUPABASE_URL}/rest/v1/comentarios`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
      body: JSON.stringify({ local_id: localId, user_id: user.id, apodo, texto })
    });
  } catch (e) {
    btnEnviar.disabled = false;
    btnEnviar.textContent = 'Enviar';
    mostrarToast('No se pudo enviar el comentario', 'error');
    return;
  }
  btnEnviar.disabled = false;
  btnEnviar.textContent = 'Enviar';
  if (!resComent.ok) { mostrarToast('No se pudo enviar el comentario', 'error'); return; }
  comentarioTimestamps.push(Date.now());
  inputComentario.value = '';
  mostrarToast('Comentario publicado', 'exito');
  cargarLikesYComentarios(localId);
}

async function borrarComentario(comentarioId) {
  await supaFetch(`${SUPABASE_URL}/rest/v1/comentarios?id=eq.${pg(comentarioId)}`, {
    method: 'DELETE'
  });
  cargarLikesYComentarios(localActivo.id);
}

async function reportarComentario(comentarioId, apodoAutor) {
  const token = localStorage.getItem('dm_token');
  const user = localStorage.getItem('dm_user');
  if (!token || !user) { window.location.href = 'login.html'; return; }
  const userId = JSON.parse(user).id;

  // Verificar si ya reportó este comentario
  const resCheck = await supaFetch(
    `${SUPABASE_URL}/rest/v1/reportes_comentarios?comentario_id=eq.${pg(comentarioId)}&user_id=eq.${pg(userId)}&select=id`,
    { headers: { 'Accept': 'application/json' }}
  );
  const yaReporto = await resCheck.json();
  if (Array.isArray(yaReporto) && yaReporto.length > 0) {
    alert('Ya reportaste este comentario anteriormente.');
    return;
  }

  // Guardar reporte con UNIQUE — si falla es porque ya existe
  const resRep = await supaFetch(
    `${SUPABASE_URL}/rest/v1/reportes_comentarios`,
    {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
      body: JSON.stringify({ comentario_id: comentarioId, user_id: userId })
    }
  );

  if (!resRep.ok) {
    alert('Ya reportaste este comentario anteriormente.');
    return;
  }

  // Guardar en tabla reportes general
  await supaFetch(`${SUPABASE_URL}/rest/v1/reportes`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
    body: JSON.stringify({
      local_nombre: `Comentario de ${apodoAutor}`,
      local_comuna: '',
      mensaje: `Comentario ID ${comentarioId} reportado como inapropiado`,
      fecha: new Date().toISOString(),
      user_id: userId
    })
  });

  // Notificar al autor
  const resComent = await supaFetch(
    `${SUPABASE_URL}/rest/v1/comentarios?id=eq.${pg(comentarioId)}&select=user_id`,
    { headers: { 'Accept': 'application/json' }}
  );
  const comentData = await resComent.json();
  if (comentData && comentData.length > 0) {
    await supaFetch(`${SUPABASE_URL}/rest/v1/notificaciones`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
      body: JSON.stringify({
        user_id: comentData[0].user_id,
        tipo: 'comentario_reportado',
        mensaje: '⚠️ Uno de tus comentarios fue reportado por la comunidad. Recuerda mantener un tono respetuoso y útil para los riders.',
        leida: false
      })
    });
  }

  alert('✅ Comentario reportado. Lo revisaremos pronto.');
}
verificarSesion();
