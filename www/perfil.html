<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mi perfil — DeliveryMap</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a0a;
      color: #ccc;
      font-family: sans-serif;
      min-height: 100vh;
      padding: 24px 20px 60px;
      max-width: 480px;
      margin: 0 auto;
    }
    .logo {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 3px;
      color: white;
      text-shadow: 0 0 10px #4a90e2;
      margin-bottom: 4px;
    }
    .logo span { color: #4a90e2; }
    .subtitulo {
      font-size: 11px;
      color: #555;
      letter-spacing: 2px;
      margin-bottom: 32px;
    }
    .avatar-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 28px;
    }
    .avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: #1a1a1a;
      border: 2px solid #333;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      margin-bottom: 12px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
    }
    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .avatar-hint {
      font-size: 12px;
      color: #555;
    }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 28px;
    }
    .stat {
      background: #1a1a1a;
      border: 0.5px solid #333;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
    }
    .stat-numero {
      font-size: 28px;
      font-weight: 700;
      color: #4a90e2;
    }
    .stat-label {
      font-size: 11px;
      color: #555;
      margin-top: 4px;
    }
    .seccion {
      margin-bottom: 24px;
    }
    label {
      display: block;
      font-size: 12px;
      color: #4a90e2;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 10px;
      color: white;
      font-size: 15px;
      padding: 12px 14px;
      outline: none;
      margin-bottom: 4px;
      transition: border 0.2s;
    }
    input:focus { border-color: #4a90e2; }
    input:disabled {
      color: #555;
      cursor: not-allowed;
    }
    .hint {
      font-size: 12px;
      color: #444;
      margin-bottom: 16px;
    }
    .btn-primary {
      width: 100%;
      padding: 14px;
      background: #4a90e2;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 12px;
      transition: opacity 0.2s;
    }
    .btn-primary:active { opacity: 0.8; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-danger {
      width: 100%;
      padding: 13px;
      background: transparent;
      color: #f44336;
      border: 1px solid #f44336;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 12px;
    }
    .mensaje {
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      text-align: center;
      margin-bottom: 16px;
      display: none;
    }
    .mensaje.error { background: #2e0f0f; color: #f44336; border: 1px solid #5c2a2a; }
    .mensaje.exito { background: #0f2e1a; color: #4caf50; border: 1px solid #2a5c35; }
    .rider-desde {
      font-size: 12px;
      color: #444;
      text-align: center;
      margin-bottom: 24px;
    }
    .volver {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #444;
      text-decoration: none;
      font-size: 13px;
    }
    #cargando {
      text-align: center;
      color: #444;
      font-size: 14px;
      padding: 40px 0;
    }
  </style>
</head>
<body>

  <div class="logo">DELIVERY<span>MAP</span></div>
  <div class="subtitulo">// CHILE DELIVERY NETWORK //</div>

  <div id="cargando">Cargando perfil...</div>

  <div id="contenido" style="display:none;">

    <div class="avatar-container">
      <div class="avatar" id="avatarDiv" onclick="document.getElementById('inputFoto').click()">
        <span id="avatarEmoji">🛵</span>
      </div>
      <div class="avatar-hint">Toca para cambiar foto</div>
      <input type="file" id="inputFoto" accept="image/*" style="display:none;" onchange="previsualizarFoto(event)"/>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-numero" id="statSugerencias">0</div>
        <div class="stat-label">Locales sugeridos</div>
      </div>
      <div class="stat">
        <div class="stat-numero" id="statReportes">0</div>
        <div class="stat-label">Errores reportados</div>
      </div>
    </div>

    <div class="rider-desde" id="riderDesde"></div>

    <div id="mensaje" class="mensaje"></div>

    <div class="seccion">
      <label for="inputApodo">Apodo</label>
      <input type="text" id="inputApodo" placeholder="Tu apodo de rider" maxlength="30"/>
      <p class="hint">Así te verán otros riders.</p>
    </div>

    <div class="seccion">
      <label>Email</label>
      <input type="email" id="inputEmail" disabled/>
      <p class="hint">El email no se puede cambiar.</p>
    </div>

    <button class="btn-primary" id="btnGuardar" onclick="guardarPerfil()">Guardar cambios</button>
    <button class="btn-danger" onclick="cerrarSesion()">Cerrar sesión</button>

  </div>

  <a class="volver" href="index.html">← Volver al mapa</a>

<script>
const SUPABASE_URL = 'https://zxwwffnjrrkmtsxzvswa.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp4d3dmZm5qcnJrbXRzeHp2c3dhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3MDU2MzksImV4cCI6MjA5NjI4MTYzOX0.0rCwuo78dkvJ-C6Y3br3s7ZuPpdikakxC21WO4dv_rI';

let token = null;
let userId = null;
let fotoNueva = null;

async function init() {
  // Refrescar token si es necesario
const userStr2 = localStorage.getItem('dm_user');
if (userStr2) {
  const userData = JSON.parse(userStr2);
  const expiry = new Date(userData.expires_at * 1000);
  if (expiry < new Date()) {
    const refreshToken = userData.refresh_token || localStorage.getItem('dm_refresh');
    if (refreshToken) {
      const resRefresh = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
        method: 'POST',
        headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ refresh_token: refreshToken })
      });
      if (resRefresh.ok) {
        const newData = await resRefresh.json();
        localStorage.setItem('dm_token', newData.access_token);
        localStorage.setItem('dm_user', JSON.stringify(newData.user));
        token = newData.access_token;
      }
    }
  }
}
  token = localStorage.getItem('dm_token');
  const userStr = localStorage.getItem('dm_user');

  if (!token || !userStr) {
    window.location.href = 'login.html';
    return;
  }

  const user = JSON.parse(userStr);
  userId = user.id;

  document.getElementById('inputEmail').value = user.email || '';
  document.getElementById('inputApodo').value = user.user_metadata?.apodo || '';

  // Fecha de registro
  if (user.created_at) {
    const fecha = new Date(user.created_at);
    const opciones = { year: 'numeric', month: 'long', day: 'numeric' };
    document.getElementById('riderDesde').textContent = `🛵 Rider desde ${fecha.toLocaleDateString('es-CL', opciones)}`;
  }

  // Cargar stats
  await cargarStats(user.email);

  // Cargar perfil desde tabla perfiles
  await cargarPerfil();

  document.getElementById('cargando').style.display = 'none';
  document.getElementById('contenido').style.display = 'block';
}

async function cargarStats(email) {
  // Contar sugerencias
  const resSug = await fetch(`${SUPABASE_URL}/rest/v1/sugerencias?select=count`, {
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${token}`, 'Prefer': 'count=exact' }
  });
  const countSug = resSug.headers.get('content-range')?.split('/')[1] || '0';
  document.getElementById('statSugerencias').textContent = countSug;

  // Contar reportes
  const resRep = await fetch(`${SUPABASE_URL}/rest/v1/reportes?select=count`, {
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${token}`, 'Prefer': 'count=exact' }
  });
  const countRep = resRep.headers.get('content-range')?.split('/')[1] || '0';
  document.getElementById('statReportes').textContent = countRep;
}

async function cargarPerfil() {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/perfiles?user_id=eq.${userId}`, {
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${token}` }
  });
  const data = await res.json();
  if (data && data.length > 0 && data[0].foto_url) {
    const avatarDiv = document.getElementById('avatarDiv');
    avatarDiv.innerHTML = `<img src="${data[0].foto_url}" alt="foto"/>`;
  }
}

function previsualizarFoto(event) {
  const file = event.target.files[0];
  if (!file) return;
  fotoNueva = file;
  const reader = new FileReader();
  reader.onload = (e) => {
    const avatarDiv = document.getElementById('avatarDiv');
    avatarDiv.innerHTML = `<img src="${e.target.result}" alt="foto"/>`;
  };
  reader.readAsDataURL(file);
}

async function guardarPerfil() {
  const apodo = document.getElementById('inputApodo').value.trim();
  const btn = document.getElementById('btnGuardar');

  if (!apodo) {
    mostrarMensaje('El apodo no puede estar vacío.', 'error');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Guardando...';

  let foto_url = null;

  // Subir foto si hay una nueva
  if (fotoNueva) {
    const ext = fotoNueva.name.split('.').pop();
    const fileName = `${userId}.${ext}`;
    const resFoto = await fetch(`${SUPABASE_URL}/storage/v1/object/Avatares/${fileName}`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${token}`,
        'Content-Type': fotoNueva.type,
        'x-upsert': 'true'
      },
      body: fotoNueva
    });

    if (resFoto.ok) {
      foto_url = `${SUPABASE_URL}/storage/v1/object/public/Avatares/${fileName}`;
      // Guardar en tabla perfiles
      await fetch(`${SUPABASE_URL}/rest/v1/perfiles`, {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json',
          'Prefer': 'resolution=merge-duplicates'
        },
        body: JSON.stringify({ user_id: userId, foto_url, apodo })
      });
    }
  }

  // Actualizar apodo en auth
  const resAuth = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
    method: 'PUT',
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${token}`,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ data: { apodo } })
  });

  if (resAuth.ok) {
    const updatedUser = await resAuth.json();
    localStorage.setItem('dm_user', JSON.stringify(updatedUser));
    mostrarMensaje('✅ Perfil actualizado.', 'exito');
  } else {
    mostrarMensaje('Error al guardar. Intenta de nuevo.', 'error');
  }

  btn.disabled = false;
  btn.textContent = 'Guardar cambios';
}

function cerrarSesion() {
  localStorage.removeItem('dm_token');
  localStorage.removeItem('dm_user');
  window.location.href = 'index.html';
}

function mostrarMensaje(texto, tipo) {
  const msg = document.getElementById('mensaje');
  msg.textContent = texto;
  msg.className = `mensaje ${tipo}`;
  msg.style.display = 'block';
}

init();
</script>
</body>
</html>
