<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mi perfil — DeliveryMap</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1b2838;
      color: #c6d4df;
      font-family: sans-serif;
      min-height: 100vh;
      max-width: 480px;
      margin: 0 auto;
      padding-bottom: 40px;
    }

    /* HEADER STEAM */
    .steam-topbar {
      background: #171a21;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #4a90e233;
    }
    .logo { font-size: 18px; font-weight: 900; letter-spacing: 3px; color: white; text-shadow: 0 0 8px #4a90e2; }
    .logo span { color: #4a90e2; }

    /* HEADER PERFIL */
    .steam-header {
      background: #316282;
      padding: 20px 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 2px solid #4a90e2;
    }
    .avatar {
      width: 72px; height: 72px;
      border-radius: 6px;
      background: #1b2838;
      border: 2px solid #4a90e2;
      display: flex; align-items: center; justify-content: center;
      font-size: 30px;
      cursor: pointer;
      overflow: hidden;
      flex-shrink: 0;
      position: relative;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .avatar-edit-hint {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.6);
      font-size: 9px; color: #c6d4df;
      text-align: center; padding: 3px 0;
      letter-spacing: 1px;
    }
    .steam-header-info { flex: 1; }
    .steam-nombre { font-size: 18px; font-weight: 700; color: white; margin-bottom: 4px; }
    .steam-since { font-size: 11px; color: #8f98a0; }
    .badge-founder {
      display: inline-block;
      background: #4a90e2;
      color: #c6d4df;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 2px;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* BODY */
    .steam-body { padding: 0 16px; }

    /* STATS */
    .steam-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 14px 0;
      border-bottom: 1px solid #4a90e233;
    }
    .stat {
      background: #16202d;
      border-radius: 4px;
      padding: 12px;
      border: 1px solid #4a90e233;
    }
    .stat-numero { font-size: 26px; font-weight: 700; color: #4a90e2; }
    .stat-label { font-size: 10px; color: #8f98a0; margin-top: 2px; text-transform: uppercase; letter-spacing: 1px; }

    /* SECCIONES */
    .steam-section {
      padding: 14px 0;
      border-bottom: 1px solid #4a90e233;
    }
    .steam-section-title {
      font-size: 10px;
      font-weight: 700;
      color: #8f98a0;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    label {
      display: block;
      font-size: 10px;
      color: #8f98a0;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      background: #16202d;
      border: 1px solid #4a90e233;
      border-radius: 4px;
      color: #c6d4df;
      font-size: 14px;
      padding: 10px 12px;
      outline: none;
      margin-bottom: 8px;
      transition: border 0.2s;
    }
    input:focus { border-color: #4a90e2; }
    input:disabled { color: #4a5566; cursor: not-allowed; }
    .hint { font-size: 11px; color: #4a5566; margin-bottom: 10px; }

    /* MENSAJES */
    .mensaje {
      padding: 10px 12px;
      border-radius: 4px;
      font-size: 13px;
      margin-bottom: 12px;
      display: none;
    }
    .mensaje.error { background: #2e0f0f; color: #f44336; border: 1px solid #5c2a2a; }
    .mensaje.exito { background: #0f2e1a; color: #4caf50; border: 1px solid #2a5c35; }

    /* BOTONES */
    .btn-primary {
      width: 100%;
      padding: 11px;
      background: #4a90e2;
      color: white;
      border: none;
      border-radius: 3px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 8px;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: opacity 0.2s;
    }
    .btn-primary:active { opacity: 0.8; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary {
      width: 100%;
      padding: 10px;
      background: #16202d;
      color: #c6d4df;
      border: 1px solid #4a90e233;
      border-radius: 3px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-align: left;
      transition: border 0.2s;
    }
    .btn-secondary:hover { border-color: #4a90e2; }
    .btn-danger {
      width: 100%;
      padding: 10px;
      background: transparent;
      color: #f44336;
      border: 1px solid #f4433644;
      border-radius: 3px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* NOTIFICACIONES */
    .notif-item {
      background: #16202d;
      border: 1px solid #4a90e233;
      border-radius: 4px;
      padding: 10px 12px;
      margin-bottom: 6px;
      font-size: 13px;
      color: #c6d4df;
      line-height: 1.5;
    }
    .notif-item.no-leida { border-color: #4a90e2; }
    .notif-fecha { font-size: 10px; color: #4a5566; margin-top: 4px; }
    .notif-vacia { font-size: 12px; color: #4a5566; text-align: center; padding: 16px 0; }
    .notif-badge-num {
      display: inline-block;
      background: #ff4444;
      color: white;
      font-size: 10px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 10px;
      margin-left: 6px;
      display: none;
    }

    /* FOOTER */
    .steam-footer {
      padding: 16px;
      text-align: center;
    }
    .volver { color: #4a5566; text-decoration: none; font-size: 12px; display: block; margin-top: 12px; }
    .terminos { color: #4a5566; text-decoration: none; font-size: 11px; }

    #cargando { text-align: center; color: #4a5566; font-size: 14px; padding: 60px 0; }
  </style>

</head>
<body>

<div class="steam-topbar">

</div>

<div id="cargando">Cargando perfil...</div>

<div id="contenido" style="display:none;">

      <div class="steam-section-title">Seguridad</div>

<div id="mensajePassword" class="mensaje"></div>

<div class="steam-section">

    <label>Email</label>

</div>

</div>

<script>
const SUPABASE_URL = 'https://zxwwffnjrrkmtsxzvswa.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp4d3dmZm5qcnJrbXRzeHp2c3dhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3MDU2MzksImV4cCI6MjA5NjI4MTYzOX0.0rCwuo78dkvJ-C6Y3br3s7ZuPpdikakxC21WO4dv_rI';

let token = null;
let userId = null;
let fotoNueva = null;

function tiempoTranscurrido(fecha) {
  const ahora = new Date();
  const entonces = new Date(fecha);
  const diff = Math.floor((ahora - entonces) / 1000);
  if (diff < 60) return 'hace unos segundos';
  if (diff < 3600) return `hace ${Math.floor(diff / 60)} minutos`;
  if (diff < 86400) return `hace ${Math.floor(diff / 3600)} horas`;
  if (diff < 2592000) return `hace ${Math.floor(diff / 86400)} días`;
  return `hace ${Math.floor(diff / 2592000)} meses`;
}

async function cargarNotificaciones() {
  const res = await fetch(
    `${SUPABASE_URL}/rest/v1/notificaciones?user_id=eq.${userId}&order=creado_en.desc&select=*`,
    { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${token}`, 'Accept': 'application/json' }}
  );
  const notifs = await res.json();
  if (!Array.isArray(notifs)) return;

  const noLeidas = notifs.filter(n => !n.leida).length;
  const badge = document.getElementById('notifBadgeNum');
  if (noLeidas > 0) {
    badge.textContent = noLeidas;
    badge.style.display = 'inline-block';
  } else {
    badge.style.display = 'none';
  }

  const lista = document.getElementById('listaNotificaciones');
  if (notifs.length === 0) {
    lista.innerHTML = '<div class="notif-vacia">Sin notificaciones aún</div>';
  } else {
    lista.innerHTML = notifs.map(n => `
      <div class="notif-item ${n.leida ? '' : 'no-leida'}">
        ${n.mensaje}
        <div class="notif-fecha">${tiempoTranscurrido(n.creado_en)}</div>
      </div>`).join('');
  }

  if (noLeidas > 0) {
    await fetch(
      `${SUPABASE_URL}/rest/v1/notificaciones?user_id=eq.${userId}&leida=eq.false`,
      { method: 'PATCH',
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
        body: JSON.stringify({ leida: true })
      }
    );
    badge.style.display = 'none';
  }
}

function toggleNotificaciones() {
  const sec = document.getElementById('seccionNotificaciones');
  if (sec.style.display === 'none') {
    sec.style.display = 'block';
    cargarNotificaciones();
  } else {
    sec.style.display = 'none';
  }
}

async function init() {
  const userStr2 = localStorage.getItem('dm_user');
  if (userStr2) {
    const userData = JSON.parse(userStr2);
    const expiry = new Date(userData.expires_at * 1000);
    if (expiry < new Date()) {
      const refreshToken = userData.refresh_token || localStorage.getItem('dm_refresh');
      if (refreshToken) {
        const resRefresh = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
          method: 'POST',
          headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
          body: JSON.stringify({ refresh_token: refreshToken })
        });
        if (resRefresh.ok) {
          const newData = await resRefresh.json();
          localStorage.setItem('dm_token', newData.access_token);
          localStorage.setItem('dm_user', JSON.stringify(newData.user));
          token = newData.access_token;
        }
      }
    }
  }

  token = localStorage.getItem('dm_token');
  const userStr = localStorage.getItem('dm_user');
  if (!token || !userStr) { window.location.href = 'login.html'; return; }

  const user = JSON.parse(userStr);
  userId = user.id;

  const apodo = user.user_metadata?.apodo || user.email?.split('@')[0] || 'Rider';
  document.getElementById('nombreDisplay').textContent = apodo;
  document.getElementById('inputEmail').value = user.email || '';
  document.getElementById('inputApodo').value = user.user_metadata?.apodo || '';

  if (user.created_at) {
    const fecha = new Date(user.created_at);
    const opciones = { year: 'numeric', month: 'long', day: 'numeric' };
    document.getElementById('riderDesde').textContent = `Rider desde ${fecha.toLocaleDateString('es-CL', opciones)}`;
  }

  await cargarStats();
  await cargarPerfil();

  // Ocultar cambiar contraseña si entró con Google
  const proveedores = user.app_metadata?.providers || [];
if (proveedores.includes('google')) {
  document.getElementById('btnCambiarPass').style.display = 'none';
  document.querySelector('.steam-section-title[style*="f44336"]').style.display = 'none';
}

  document.getElementById('cargando').style.display = 'none';
  document.getElementById('contenido').style.display = 'block';

  cargarNotificaciones();
}

async function cargarStats() {
  const resSug = await fetch(`${SUPABASE_URL}/rest/v1/sugerencias?user_id=eq.${userId}&select=count`, {
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${token}`, 'Prefer': 'count=exact' }
  });
  document.getElementById('statSugerencias').textContent = resSug.headers.get('content-range')?.split('/')[1] || '0';

  const resRep = await fetch(`${SUPABASE_URL}/rest/v1/reportes?user_id=eq.${userId}&select=count`, {
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${token}`, 'Prefer': 'count=exact' }
  });
  document.getElementById('statReportes').textContent = resRep.headers.get('content-range')?.split('/')[1] || '0';
}
async function cargarPerfil() {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/perfiles?user_id=eq.${userId}&select=*`, {
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${token}`, 'Accept': 'application/json' }
  });
  const data = await res.json();
  if (data && data.length > 0) {
    if (data[0].foto_url) {
      document.getElementById('avatarDiv').innerHTML = `<img src="${data[0].foto_url}" alt="foto"/><div class="avatar-edit-hint">CAMBIAR</div>`;
      document.getElementById('avatarDiv').onclick = () => document.getElementById('inputFoto').click();
    }
    if (data[0].badge) {
      const badgeLabels = { 'founder': '⚡ FUNDADOR' };
      const badgeDiv = document.getElementById('badgeDiv');
      badgeDiv.innerHTML = `<span class="badge-founder">${badgeLabels[data[0].badge] || data[0].badge}</span>`;
    }
  }
}

function previsualizarFoto(event) {
  const file = event.target.files[0];
  if (!file) return;
  fotoNueva = file;
  const reader = new FileReader();
  reader.onload = (e) => {
    document.getElementById('avatarDiv').innerHTML = `<img src="${e.target.result}" alt="foto"/><div class="avatar-edit-hint">CAMBIAR</div>`;
    document.getElementById('avatarDiv').onclick = () => document.getElementById('inputFoto').click();
  };
  reader.readAsDataURL(file);
}

async function guardarPerfil() {
  const apodo = document.getElementById('inputApodo').value.trim();
  const btn = document.getElementById('btnGuardar');
  if (!apodo) { mostrarMensaje('El apodo no puede estar vacío.', 'error'); return; }

  btn.disabled = true;
  btn.textContent = 'Guardando...';
  let foto_url = null;

  if (fotoNueva) {
    const ext = fotoNueva.name.split('.').pop();
    const fileName = `${userId}.${ext}`;
    const resFoto = await fetch(`${SUPABASE_URL}/storage/v1/object/Avatares/${fileName}`, {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${token}`, 'Content-Type': fotoNueva.type, 'x-upsert': 'true' },
      body: fotoNueva
    });
    if (resFoto.ok) {
      foto_url = `${SUPABASE_URL}/storage/v1/object/public/Avatares/${fileName}`;
      await fetch(`${SUPABASE_URL}/rest/v1/perfiles`, {
        method: 'POST',
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates' },
        body: JSON.stringify({ user_id: userId, foto_url, apodo })
      });
    }
  }

  const resAuth = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
    method: 'PUT',
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({ data: { apodo } })
  });

  if (resAuth.ok) {
    const updatedUser = await resAuth.json();
    localStorage.setItem('dm_user', JSON.stringify(updatedUser));
    document.getElementById('nombreDisplay').textContent = apodo;
    mostrarMensaje('✅ Perfil actualizado.', 'exito');
  } else {
    mostrarMensaje('Error al guardar. Intenta de nuevo.', 'error');
  }

  btn.disabled = false;
  btn.textContent = 'Guardar cambios';
}

function cerrarSesion() {
  localStorage.removeItem('dm_token');
  localStorage.removeItem('dm_user');
  window.location.href = 'app.html';
}

function mostrarMensaje(texto, tipo) {
  const msg = document.getElementById('mensaje');
  msg.textContent = texto;
  msg.className = `mensaje ${tipo}`;
  msg.style.display = 'block';
}
async function enviarResetPassword() {
  const btn = document.getElementById('btnCambiarPass');
  const msg = document.getElementById('mensajePassword');
  const email = document.getElementById('inputEmail').value;

  btn.disabled = true;
  btn.textContent = 'Enviando...';

  const res = await fetch(`${SUPABASE_URL}/auth/v1/recover`, {
    method: 'POST',
    headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ 
  email,
  redirect_to: 'https://deliverymap.cl/cambiar-password.html'
})
  });

  if (res.ok) {
    msg.textContent = `✅ Te enviamos un email a ${email} con el link para cambiar tu contraseña.`;
    msg.className = 'mensaje exito';
    msg.style.display = 'block';
  } else {
    msg.textContent = 'No se pudo enviar el email. Intenta de nuevo.';
    msg.className = 'mensaje error';
    msg.style.display = 'block';
  }

  btn.disabled = false;
  btn.textContent = '🔒 Cambiar contraseña';
}

function toggleEliminarCuenta() {
  const sec = document.getElementById('seccionEliminar');
  sec.style.display = sec.style.display === 'none' ? 'block' : 'none';
}

async function confirmarEliminarCuenta() {
  const email = document.getElementById('eliminarEmail').value.trim();
  const password = document.getElementById('eliminarPassword').value;
  const msg = document.getElementById('mensajeEliminar');

  if (!email || !password) {
    msg.textContent = 'Completa email y contraseña.';
    msg.className = 'mensaje error'; msg.style.display = 'block'; return;
  }

  const confirma = confirm('¿Estás seguro? Esta acción es irreversible.');
  if (!confirma) return;

  // Verificar credenciales primero
  const resLogin = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
    method: 'POST',
    headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password })
  });

  if (!resLogin.ok) {
    msg.textContent = 'Email o contraseña incorrectos.';
    msg.className = 'mensaje error'; msg.style.display = 'block'; return;
  }

  // Credenciales correctas — eliminar via función SQL
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/eliminar_cuenta_propia`, {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${token}`,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({})
  });

  if (res.ok) {
    localStorage.removeItem('dm_token');
    localStorage.removeItem('dm_user');
    localStorage.removeItem('dm_refresh');
    alert('Cuenta eliminada. Hasta pronto.');
    window.location.href = 'index.html';
  } else {
    msg.textContent = 'No se pudo eliminar la cuenta. Intenta de nuevo.';
    msg.className = 'mensaje error'; msg.style.display = 'block';
  }
}
init();
</script>
