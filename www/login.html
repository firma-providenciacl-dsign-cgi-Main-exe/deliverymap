<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Iniciar sesión — DeliveryMap</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a0a;
      color: #ccc;
      font-family: sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
    }
    .container {
      width: 100%;
      max-width: 380px;
    }
    .logo {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 3px;
      color: white;
      text-shadow: 0 0 10px #4a90e2;
      text-align: center;
      margin-bottom: 4px;
    }
    .logo span { color: #4a90e2; }
    .subtitulo {
      font-size: 11px;
      color: #555;
      letter-spacing: 2px;
      text-align: center;
      margin-bottom: 40px;
    }
    h1 {
      font-size: 20px;
      color: white;
      margin-bottom: 24px;
      text-align: center;
    }
    label {
      display: block;
      font-size: 12px;
      color: #4a90e2;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 10px;
      color: white;
      font-size: 15px;
      padding: 12px 14px;
      outline: none;
      margin-bottom: 16px;
      transition: border 0.2s;
    }
    input:focus { border-color: #4a90e2; }
    .btn-primary {
      width: 100%;
      padding: 14px;
      background: #4a90e2;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-bottom: 12px;
    }
    .btn-primary:active { opacity: 0.8; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-google {
      width: 100%;
      padding: 13px;
      background: #1a1a1a;
      color: white;
      border: 1px solid #444;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: border 0.2s;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .btn-google:active { opacity: 0.8; }
    .separador {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .separador hr {
      flex: 1;
      border: none;
      border-top: 1px solid #333;
    }
    .separador span {
      font-size: 12px;
      color: #555;
    }
    .mensaje {
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      text-align: center;
      margin-bottom: 16px;
      display: none;
    }
    .mensaje.error { background: #2e0f0f; color: #f44336; border: 1px solid #5c2a2a; }
    .mensaje.exito { background: #0f2e1a; color: #4caf50; border: 1px solid #2a5c35; }
    .links {
      text-align: center;
      font-size: 13px;
      color: #666;
    }
    .links a { color: #4a90e2; text-decoration: none; }
    .volver {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #444;
      text-decoration: none;
      font-size: 13px;
    }
  </style>
</head>
<body>
<div class="container">

  <div class="logo">DELIVERY<span>MAP</span></div>
  <div class="subtitulo">// CHILE DELIVERY NETWORK //</div>

  <h1>Iniciar sesión</h1>

  <div id="mensaje" class="mensaje"></div>

  <label for="email">Email</label>
  <input type="email" id="email" placeholder="tu@email.com" autocomplete="email"/>

  <label for="password">Contraseña</label>
  <input type="password" id="password" placeholder="••••••••" autocomplete="current-password"
    onkeyup="if(event.key==='Enter') iniciarSesion()"/>

  <button class="btn-primary" id="btnLogin" onclick="iniciarSesion()">Entrar</button>

  <div class="separador">
    <hr/><span>o</span><hr/>
  </div>

  <button class="btn-google" onclick="loginGoogle()">
    <svg width="18" height="18" viewBox="0 0 24 24">
      <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
      <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
    </svg>
    Continuar con Google
  </button>

<div class="links">
    ¿No tienes cuenta? <a href="registro.html">Crear cuenta</a>
</div>
<div class="links" style="margin-top:10px;">
    ¿Olvidaste tu contraseña? <a href="#" onclick="olvideMiPassword()">Restablecer</a>
</div>

  <a class="volver" href="app.html">← Volver al mapa</a>

</div>

<script>
const SUPABASE_URL = 'https://zxwwffnjrrkmtsxzvswa.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp4d3dmZm5qcnJrbXRzeHp2c3dhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3MDU2MzksImV4cCI6MjA5NjI4MTYzOX0.0rCwuo78dkvJ-C6Y3br3s7ZuPpdikakxC21WO4dv_rI';

async function iniciarSesion() {
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn      = document.getElementById('btnLogin');
  const msg      = document.getElementById('mensaje');

  if (!email || !password) {
    mostrarMensaje('Completa todos los campos.', 'error');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Entrando...';

  const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_KEY,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ email, password })
  });

  const data = await res.json();

  if (res.ok && data.access_token) {
    localStorage.setItem('dm_token', data.access_token);
    localStorage.setItem('dm_user', JSON.stringify(data.user));
    if (data.refresh_token) localStorage.setItem('dm_refresh', data.refresh_token);
    mostrarMensaje('✅ ¡Bienvenido!', 'exito');
    setTimeout(() => { window.location.href = 'app.html'; }, 1000);
  } else {
    mostrarMensaje('Email o contraseña incorrectos.', 'error');
    btn.disabled = false;
    btn.textContent = 'Entrar';
  }
}

function loginGoogle() {
  window.location.href = `${SUPABASE_URL}/auth/v1/authorize?provider=google&redirect_to=https://deliverymap.cl/app.html`;
}
function mostrarMensaje(texto, tipo) {
  const msg = document.getElementById('mensaje');
  msg.textContent = texto;
  msg.className = `mensaje ${tipo}`;
  msg.style.display = 'block';
}
async function olvideMiPassword() {
  const email = document.getElementById('email').value.trim();
  if (!email) {
    mostrarMensaje('Escribe tu email arriba primero.', 'error');
    return;
  }
  const res = await fetch(`${SUPABASE_URL}/auth/v1/recover`, {
    method: 'POST',
    headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ 
  email,
  redirect_to: 'https://deliverymap.cl/cambiar-password.html'
})
  });
  if (res.ok) {
    mostrarMensaje(`✅ Te enviamos un email a ${email} con el link para restablecer tu contraseña.`, 'exito');
  } else {
    mostrarMensaje('No se pudo enviar el email. Intenta de nuevo.', 'error');
  }
}
</script>
</body>
</html>
