<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Panel - Delivery App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #1a1a1a; color: white; min-height: 100vh; }

    #loginScreen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 12px;
      padding: 24px;
    }

    #appScreen {
      display: none;
      padding: 20px 16px;
      max-width: 500px;
      margin: 0 auto;
    }

    h2 {
      color: #FF6B2C;
      font-size: 20px;
      margin-bottom: 20px;
    }

    input, textarea {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #2a2a2a;
      color: white;
      font-size: 15px;
      outline: none;
      margin-bottom: 10px;
    }

    input::placeholder, textarea::placeholder { color: #666; }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    button {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: none;
      background: #FF6B2C;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
    }

    button:active { opacity: 0.85; }

    #mensaje {
      margin-top: 14px;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      font-size: 14px;
      display: none;
    }

    .exito { background: #1a3a1a; color: #4caf50; }
    .error { background: #3a1a1a; color: #f44336; }

    .hint {
      font-size: 12px;
      color: #666;
      margin-bottom: 10px;
      margin-top: -6px;
    }

    #coordsBtn {
      background: #2a2a2a;
      border: 1px solid #444;
      font-size: 13px;
      font-weight: 400;
      margin-bottom: 10px;
    }

    /* SUGERENCIAS */
    #seccionSugerencias { margin-top: 32px; }
    #seccionSugerencias h2 { color: #4a90e2; }
    .sug-card {
      background: #2a2a2a; border: 1px solid #333;
      border-radius: 10px; padding: 14px;
      margin-bottom: 12px;
    }
    .sug-nombre { font-size: 15px; font-weight: 700; color: white; margin-bottom: 2px; }
    .sug-comuna { font-size: 12px; color: #888; margin-bottom: 6px; }
    .sug-nota { font-size: 13px; color: #aaa; line-height: 1.5; margin-bottom: 10px; }
    .sug-foto { margin-bottom: 10px; }
    .sug-foto img {
      width: 80px; height: 80px; object-fit: cover;
      border-radius: 8px; border: 1px solid #444;
      cursor: pointer; display: block;
    }
    .sug-fecha { font-size: 11px; color: #555; margin-bottom: 10px; }
    .sug-btns { display: flex; gap: 8px; }
    .btn-aprobar {
      flex: 1; padding: 10px; border-radius: 8px;
      background: #1a3a1a; color: #4caf50;
      border: 1px solid #2a5c35; font-size: 13px;
      font-weight: 600; cursor: pointer;
    }
    .btn-rechazar {
      flex: 1; padding: 10px; border-radius: 8px;
      background: #3a1a1a; color: #f44336;
      border: 1px solid #5c2a2a; font-size: 13px;
      font-weight: 600; cursor: pointer;
    }
    .btn-aprobar:disabled, .btn-rechazar:disabled { opacity: 0.5; cursor: not-allowed; }
    #sinSugerencias { color: #555; font-size: 13px; text-align: center; padding: 20px 0; }
  </style>
</head>
<body>

<div id="loginScreen">
  <h2 style="font-size:22px;">🔒 Panel Admin</h2>
  <input id="passInput" type="email" placeholder="Email" style="max-width:300px;"/>
  <input id="passInput2" type="password" placeholder="Contraseña" style="max-width:300px;" onkeyup="if(event.key==='Enter') login()"/>
  <button style="max-width:300px;" onclick="login()">Entrar</button>
  <p id="loginError" style="color:#f44336;font-size:13px;display:none;">Credenciales incorrectas</p>
</div>

<div id="appScreen">
  <h2>➕ Agregar local</h2>

  <input id="nombre" type="text" placeholder="Nombre del local" autocomplete="off"/>
  <input id="comuna" type="text" placeholder="Comuna" autocomplete="off"/>
  <textarea id="nota" placeholder="Nota: cómo llegar, entrada, piso, etc."></textarea>
  <input id="lat" type="number" step="any" placeholder="Latitud (ej: -33.4382)"/>
  <input id="lng" type="number" step="any" placeholder="Longitud (ej: -70.5612)"/>
  <p class="hint">💡 Para obtener lat/lng: abre Google Maps, mantén presionado en el local y copia los números que aparecen abajo.</p>

  <button onclick="agregar()">Guardar local</button>
  <div id="mensaje"></div>

  <div id="seccionSugerencias">
    <h2>📋 Sugerencias pendientes</h2>
    <div id="listaSugerencias"><div id="sinSugerencias">Cargando...</div></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://zxwwffnjrrkmtsxzvswa.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp4d3dmZm5qcnJrbXRzeHp2c3dhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3MDU2MzksImV4cCI6MjA5NjI4MTYzOX0.0rCwuo78dkvJ-C6Y3br3s7ZuPpdikakxC21WO4dv_rI';
let SESSION_TOKEN = null;

async function login() {
  const email = document.getElementById('passInput').value.trim();
  const pass  = document.getElementById('passInput2').value;
  const err   = document.getElementById('loginError');
  const btn   = document.querySelector('#loginScreen button');

  err.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Entrando...';

  try {
    const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: pass })
    });
    const data = await res.json();

    if (!res.ok || !data.access_token) {
      err.textContent = 'Credenciales incorrectas.';
      err.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Entrar'; return;
    }

    SESSION_TOKEN = data.access_token;
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appScreen').style.display = 'block';
    cargarSugerencias();
  } catch (e) {
    err.textContent = 'Error de red. Intenta de nuevo.';
    err.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Entrar';
  }
}

async function cargarSugerencias() {
  const lista = document.getElementById('listaSugerencias');
  lista.textContent = '';
  const cargando = document.createElement('div');
  cargando.id = 'sinSugerencias';
  cargando.textContent = 'Cargando...';
  lista.appendChild(cargando);

  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/sugerencias?estado=in.(pendiente,pendiente_foto)&order=fecha.asc&select=id,nombre,comuna,nota,foto_url,fecha,estado`, {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SESSION_TOKEN}` }
    });
    const data = await res.json();
    lista.textContent = '';

    if (!Array.isArray(data) || data.length === 0) {
      const vacio = document.createElement('div');
      vacio.id = 'sinSugerencias';
      vacio.textContent = 'No hay sugerencias pendientes.';
      lista.appendChild(vacio);
      return;
    }

    data.forEach(s => {
      const card = document.createElement('div');
      card.className = 'sug-card';
      card.id = `sug-${s.id}`;

      if (s.estado === 'pendiente_foto') {
        const badge = document.createElement('div');
        badge.textContent = '📷 Foto para local existente';
        badge.style.cssText = 'font-size:11px;color:#4a90e2;margin-bottom:6px;';
        card.appendChild(badge);
      }

      const nombre = document.createElement('div');
      nombre.className = 'sug-nombre';
      nombre.textContent = s.nombre || '';
      card.appendChild(nombre);

      const comuna = document.createElement('div');
      comuna.className = 'sug-comuna';
      comuna.textContent = s.comuna || '';
      card.appendChild(comuna);

      const nota = document.createElement('div');
      nota.className = 'sug-nota';
      nota.textContent = s.nota || '';
      card.appendChild(nota);

      if (s.foto_url) {
        const fotoWrap = document.createElement('div');
        fotoWrap.className = 'sug-foto';
        const img = document.createElement('img');
        img.src = s.foto_url;
        img.alt = 'foto';
        img.onclick = () => window.open(s.foto_url, '_blank');
        fotoWrap.appendChild(img);
        card.appendChild(fotoWrap);
      }

      const fecha = document.createElement('div');
      fecha.className = 'sug-fecha';
      fecha.textContent = s.fecha ? new Date(s.fecha).toLocaleString('es-CL') : '';
      card.appendChild(fecha);

      const btns = document.createElement('div');
      btns.className = 'sug-btns';

      const btnAprobar = document.createElement('button');
      btnAprobar.className = 'btn-aprobar';
      btnAprobar.textContent = '✅ Aprobar';
      btnAprobar.onclick = () => aprobarSugerencia(s.id, s.nombre, s.comuna, s.nota, s.foto_url, s.estado);

      const btnRechazar = document.createElement('button');
      btnRechazar.className = 'btn-rechazar';
      btnRechazar.textContent = '✕ Rechazar';
      btnRechazar.onclick = () => rechazarSugerencia(s.id);

      btns.appendChild(btnAprobar);
      btns.appendChild(btnRechazar);
      card.appendChild(btns);

      lista.appendChild(card);
    });
  } catch(e) {
    lista.textContent = '';
    const errDiv = document.createElement('div');
    errDiv.id = 'sinSugerencias';
    errDiv.textContent = 'Error al cargar sugerencias.';
    lista.appendChild(errDiv);
  }
}

function escPanel(str) {
  return str == null ? '' : String(str).replace(/'/g, "\\'").replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function quitarCardSiVacia() {
  const lista = document.getElementById('listaSugerencias');
  if (lista.querySelectorAll('.sug-card').length === 0) {
    lista.textContent = '';
    const vacio = document.createElement('div');
    vacio.id = 'sinSugerencias';
    vacio.textContent = 'No hay sugerencias pendientes.';
    lista.appendChild(vacio);
  }
}

async function aprobarSugerencia(id, nombre, comuna, nota, foto_url, estado) {
  const card = document.getElementById(`sug-${id}`);

  // Foto para local existente: solo vincular foto, sin crear local
  if (estado === 'pendiente_foto') {
    const match = nota ? nota.match(/ID:\s*(\d+)/) : null;
    const localId = match ? parseInt(match[1]) : null;
    if (!localId) { alert('No se pudo leer el local_id de la nota.'); return; }
    card.querySelectorAll('button').forEach(b => b.disabled = true);

    await fetch(`${SUPABASE_URL}/rest/v1/local_fotos`, {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SESSION_TOKEN}`, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
      body: JSON.stringify({ local_id: localId, url: foto_url })
    });

    const resPatch = await fetch(`${SUPABASE_URL}/rest/v1/sugerencias?id=eq.${id}`, {
      method: 'PATCH',
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SESSION_TOKEN}`, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
      body: JSON.stringify({ estado: 'aprobada' })
    });
    if (!resPatch.ok) { alert('Error al aprobar la sugerencia.'); card.querySelectorAll('button').forEach(b => b.disabled = false); return; }
    card.remove();
    quitarCardSiVacia();
    return;
  }

  // Sugerencia normal: crear local
  const lat = parseFloat(prompt(`Latitud para "${nombre}":`));
  if (isNaN(lat)) return;
  const lng = parseFloat(prompt(`Longitud para "${nombre}":`));
  if (isNaN(lng)) return;
  if (lat < -60 || lat > -15 || lng < -80 || lng > -65) {
    alert('Coordenadas fuera del rango válido para Chile.');
    return;
  }

  card.querySelectorAll('button').forEach(b => b.disabled = true);

  const resLocal = await fetch(`${SUPABASE_URL}/rest/v1/locales`, {
    method: 'POST',
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SESSION_TOKEN}`, 'Content-Type': 'application/json', 'Prefer': 'return=representation' },
    body: JSON.stringify({ nombre, comuna, nota, lat, lng })
  });

  if (!resLocal.ok) {
    alert('Error al crear el local.');
    card.querySelectorAll('button').forEach(b => b.disabled = false);
    return;
  }

  const localData = await resLocal.json();
  const localId = localData[0]?.id;

  if (foto_url && localId) {
    await fetch(`${SUPABASE_URL}/rest/v1/local_fotos`, {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SESSION_TOKEN}`, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
      body: JSON.stringify({ local_id: localId, url: foto_url })
    });
  }

  const resPatch = await fetch(`${SUPABASE_URL}/rest/v1/sugerencias?id=eq.${id}`, {
    method: 'PATCH',
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SESSION_TOKEN}`, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
    body: JSON.stringify({ estado: 'aprobada' })
  });
  if (!resPatch.ok) { alert('Error al aprobar la sugerencia.'); card.querySelectorAll('button').forEach(b => b.disabled = false); return; }
  card.remove();
  quitarCardSiVacia();
}

async function rechazarSugerencia(id) {
  if (!confirm('¿Rechazar esta sugerencia?')) return;
  const card = document.getElementById(`sug-${id}`);
  card.querySelectorAll('button').forEach(b => b.disabled = true);

  const res = await fetch(`${SUPABASE_URL}/rest/v1/sugerencias?id=eq.${id}`, {
    method: 'PATCH',
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SESSION_TOKEN}`, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
    body: JSON.stringify({ estado: 'rechazada' })
  });

  if (!res.ok) { alert('Error al rechazar la sugerencia.'); card.querySelectorAll('button').forEach(b => b.disabled = false); return; }
  card.remove();
  quitarCardSiVacia();
}

async function agregar() {
  const nombre = document.getElementById('nombre').value.trim();
  const comuna = document.getElementById('comuna').value.trim();
  const nota   = document.getElementById('nota').value.trim();
  const lat    = parseFloat(document.getElementById('lat').value);
  const lng    = parseFloat(document.getElementById('lng').value);
  const msg    = document.getElementById('mensaje');

  if (!nombre || !comuna || !nota || isNaN(lat) || isNaN(lng)) {
    msg.className = 'error';
    msg.textContent = 'Completa todos los campos.';
    msg.style.display = 'block';
    return;
  }
  if (lat < -60 || lat > -15 || lng < -80 || lng > -65) {
    msg.className = 'error';
    msg.textContent = 'Coordenadas fuera del rango válido para Chile.';
    msg.style.display = 'block';
    return;
  }

  const res = await fetch(`${SUPABASE_URL}/rest/v1/locales`, {
    method: 'POST',
headers: {
  'apikey': SUPABASE_KEY,
  'Authorization': `Bearer ${SESSION_TOKEN}`,
  'Content-Type': 'application/json',
  'Prefer': 'return=minimal'
},
    body: JSON.stringify({ nombre, comuna, nota, lat, lng })
  });

  if (res.ok) {
    msg.className = 'exito';
    msg.textContent = '✅ Local guardado correctamente.';
    msg.style.display = 'block';
    document.getElementById('nombre').value = '';
    document.getElementById('comuna').value = '';
    document.getElementById('nota').value = '';
    document.getElementById('lat').value = '';
    document.getElementById('lng').value = '';
  } else {
    msg.className = 'error';
    msg.textContent = '❌ Error al guardar. Intenta de nuevo.';
    msg.style.display = 'block';
  }
}
</script>
</body>
</html>
