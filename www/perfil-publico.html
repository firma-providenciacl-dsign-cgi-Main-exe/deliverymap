<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Perfil — DeliveryMap</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0a0a; color: #ccc; font-family: sans-serif; min-height: 100vh; padding: 24px 20px 60px; max-width: 480px; margin: 0 auto; }
    .logo { font-size: 22px; font-weight: 900; letter-spacing: 3px; color: white; text-shadow: 0 0 10px #4a90e2; margin-bottom: 4px; }
    .logo span { color: #4a90e2; }
    .subtitulo { font-size: 11px; color: #555; letter-spacing: 2px; margin-bottom: 32px; }
    .avatar-container { display: flex; flex-direction: column; align-items: center; margin-bottom: 20px; }
    .avatar { width: 90px; height: 90px; border-radius: 50%; background: #1a1a1a; border: 2px solid #333; display: flex; align-items: center; justify-content: center; font-size: 36px; overflow: hidden; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .apodo { font-size: 22px; font-weight: 700; color: white; margin-top: 12px; }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; letter-spacing: 1px; margin-top: 6px; text-transform: uppercase; }
    .badge-founder { background: linear-gradient(90deg, #4a90e2, #00f0ff); color: #0a0a0a; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 28px; }
    .stat { background: #1a1a1a; border: 0.5px solid #333; border-radius: 12px; padding: 14px; text-align: center; }
    .stat-numero { font-size: 28px; font-weight: 700; color: #4a90e2; }
    .stat-label { font-size: 11px; color: #555; margin-top: 4px; }
    .rider-desde { font-size: 12px; color: #444; text-align: center; margin-bottom: 24px; }
    .volver { display: block; text-align: center; margin-top: 20px; color: #444; text-decoration: none; font-size: 13px; }
    #cargando { text-align: center; color: #444; font-size: 14px; padding: 40px 0; }
  </style>
</head>
<body>
  <div class="logo">DELIVERY<span>MAP</span></div>
  <div class="subtitulo">// CHILE DELIVERY NETWORK //</div>

  <div id="cargando">Cargando perfil...</div>

  <div id="contenido" style="display:none;">
    <div class="avatar-container">
      <div class="avatar" id="avatarDiv"><span>🛵</span></div>
      <div class="apodo" id="apodoDiv"></div>
      <div id="badgeDiv"></div>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-numero" id="statSugerencias">0</div>
        <div class="stat-label">Locales sugeridos</div>
      </div>
      <div class="stat">
        <div class="stat-numero" id="statReportes">0</div>
        <div class="stat-label">Errores reportados</div>
      </div>
    </div>

    <div class="rider-desde" id="riderDesde"></div>
  </div>

  <a class="volver" href="app.html">← Volver al mapa</a>

<script>
const SUPABASE_URL = 'https://zxwwffnjrrkmtsxzvswa.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp4d3dmZm5qcnJrbXRzeHp2c3dhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3MDU2MzksImV4cCI6MjA5NjI4MTYzOX0.0rCwuo78dkvJ-C6Y3br3s7ZuPpdikakxC21WO4dv_rI';

async function init() {
  const params = new URLSearchParams(window.location.search);
  const userId = params.get('id');
  if (!userId) { document.getElementById('cargando').textContent = 'Perfil no encontrado.'; return; }

  // Cargar perfil
  const resPerfil = await fetch(`${SUPABASE_URL}/rest/v1/perfiles?user_id=eq.${userId}&select=*`, {
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Accept': 'application/json' }
  });
  const perfiles = await resPerfil.json();
  const perfil = perfiles?.[0];

  if (perfil?.foto_url) {
    document.getElementById('avatarDiv').innerHTML = `<img src="${perfil.foto_url}" alt="foto"/>`;
  }
  if (perfil?.apodo) {
    document.getElementById('apodoDiv').textContent = perfil.apodo;
  }
  if (perfil?.badge) {
    const badgeLabels = { 'founder': '⚡ Fundador' };
    const badgeClasses = { 'founder': 'badge-founder' };
    document.getElementById('badgeDiv').innerHTML = `<div class="badge ${badgeClasses[perfil.badge] || ''}">${badgeLabels[perfil.badge] || perfil.badge}</div>`;
  }

  // Stats
  const resSug = await fetch(`${SUPABASE_URL}/rest/v1/sugerencias?select=count`, {
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Prefer': 'count=exact' }
  });
  document.getElementById('statSugerencias').textContent = resSug.headers.get('content-range')?.split('/')[1] || '0';

  const resRep = await fetch(`${SUPABASE_URL}/rest/v1/reportes?select=count`, {
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Prefer': 'count=exact' }
  });
  document.getElementById('statReportes').textContent = resRep.headers.get('content-range')?.split('/')[1] || '0';

  document.getElementById('cargando').style.display = 'none';
  document.getElementById('contenido').style.display = 'block';
}

init();
</script>
</body>
</html>
