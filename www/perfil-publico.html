<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Perfil — DeliveryMap</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: linear-gradient(135deg, #080d1a 0%, #0a1128 50%, #080d1a 100%);
      color: #ffffff;
      font-family: sans-serif;
      min-height: 100vh;
      max-width: 480px;
      margin: 0 auto;
      padding-bottom: 40px;
    }
    .steam-topbar {
      background: rgba(10,14,26,0.97);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(30,144,255,0.2);
    }
    .logo { font-size: 18px; font-weight: 900; letter-spacing: 3px; color: #ff00cc; text-shadow: 0 0 8px #ff00cc; }
    .logo span { color: #4a90e2; }
    .steam-header {
      background: rgba(8,20,60,0.85);
      border: 1px solid rgba(30,144,255,0.8);
      box-shadow: 0 0 25px rgba(30,144,255,0.25);
      border-radius: 12px;
      margin: 14px 16px;
      padding: 20px 16px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .avatar {
      width: 72px; height: 72px;
      border-radius: 10px;
      background: rgba(10,25,60,0.6);
      border: 2px solid rgba(30,144,255,0.6);
      display: flex; align-items: center; justify-content: center;
      font-size: 30px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .steam-header-info { flex: 1; }
    .steam-nombre { font-size: 18px; font-weight: 700; color: #ffffff; margin-bottom: 4px; }
    .steam-since { font-size: 11px; color: rgba(255,255,255,0.6); margin-bottom: 4px; }
    .badge-founder {
      display: inline-block;
      background: linear-gradient(135deg, #f0a500, #e07b00);
      color: #ffffff;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .steam-body { padding: 0 16px; }
    .steam-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 14px 16px;
    }
    .stat {
      background: rgba(10,30,70,0.8);
      border-radius: 12px;
      padding: 14px;
      border: 1px solid #1e90ff;
      box-shadow: 0 0 12px rgba(30,144,255,0.15);
    }
    .stat-numero { font-size: 26px; font-weight: 700; color: #ffffff; }
    .stat-label { font-size: 10px; color: #ffffff; margin-top: 2px; text-transform: uppercase; letter-spacing: 1px; }
    .steam-footer {
      padding: 16px;
      text-align: center;
    }
    .volver { color: #4da6ff; text-decoration: none; font-size: 12px; display: block; margin-top: 12px; }
    .terminos { color: rgba(255,255,255,0.5); text-decoration: none; font-size: 11px; }
    #cargando { text-align: center; color: rgba(255,255,255,0.5); font-size: 14px; padding: 60px 0; }
  </style>
  <script defer src="https://cloud.umami.is/script.js" data-website-id="568d65a7-876b-405a-a4b2-3b6a35d3d8f9"></script>
</head>
<body>

<div class="steam-topbar">
  <div class="logo">DELIVERY<span>MAP</span></div>
  <div style="font-size:11px; color:#8f98a0; letter-spacing:2px;">// PERFIL //</div>
</div>

<div id="cargando">Cargando perfil...</div>

<div id="contenido" style="display:none;">
  <div class="steam-header">
    <div class="avatar" id="avatarDiv"><span>🛵</span></div>
    <div class="steam-header-info">
      <div class="steam-nombre" id="apodoDiv">Rider</div>
      <div class="steam-since" id="riderDesde"></div>
      <div id="badgeDiv"></div>
    </div>
  </div>

  <div class="steam-body">
    <div class="steam-stats">
      <div class="stat">
        <div class="stat-numero" id="statSugerencias">0</div>
        <div class="stat-label">Locales sugeridos</div>
      </div>
      <div class="stat">
        <div class="stat-numero" id="statReportes">0</div>
        <div class="stat-label">Errores reportados</div>
      </div>
    </div>
  </div>
</div>

<div class="steam-footer">
  <a href="app.html" class="volver">← Volver al mapa</a>
  <a href="terminos.html" class="terminos" style="display:block; margin-top:8px;">Términos de uso</a>
</div>

<script>
const SUPABASE_URL = 'https://zxwwffnjrrkmtsxzvswa.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp4d3dmZm5qcnJrbXRzeHp2c3dhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3MDU2MzksImV4cCI6MjA5NjI4MTYzOX0.0rCwuo78dkvJ-C6Y3br3s7ZuPpdikakxC21WO4dv_rI';

function pg(value) {
  return encodeURIComponent(String(value));
}

function safeSupabaseImageUrl(url) {
  try {
    const parsed = new URL(url);
    return parsed.protocol === 'https:' && parsed.hostname === 'zxwwffnjrrkmtsxzvswa.supabase.co'
      ? parsed.href
      : '';
  } catch (e) {
    return '';
  }
}

async function init() {
  const params = new URLSearchParams(window.location.search);
  const userId = params.get('id');
  if (!userId) { document.getElementById('cargando').textContent = 'Perfil no encontrado.'; return; }

  // Cargar perfil
  const resPerfil = await fetch(`${SUPABASE_URL}/rest/v1/perfiles?user_id=eq.${pg(userId)}&select=foto_url,apodo,badge`, {
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Accept': 'application/json' }
  });
  const perfiles = await resPerfil.json();
  const perfil = perfiles?.[0];

  if (perfil?.foto_url) {
    const fotoUrl = safeSupabaseImageUrl(perfil.foto_url);
    if (fotoUrl) {
      const avatarDiv = document.getElementById('avatarDiv');
      avatarDiv.innerHTML = '';
      const img = document.createElement('img');
      img.src = fotoUrl;
      img.alt = 'foto';
      avatarDiv.appendChild(img);
    }
  }

  if (perfil?.apodo) {
    document.getElementById('apodoDiv').textContent = perfil.apodo;
  } else {
    const resApodo = await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_apodo_publico`, {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ uid: userId })
    });
    const apodo = await resApodo.json();
    document.getElementById('apodoDiv').textContent = apodo || 'Rider';
  }

  if (perfil?.badge) {
    const badgeLabels = { 'founder': '⚡ FUNDADOR' };
    const badgeDiv = document.getElementById('badgeDiv');
    badgeDiv.innerHTML = '';
    const span = document.createElement('span');
    span.className = 'badge-founder';
    span.textContent = badgeLabels[perfil.badge] || perfil.badge;
    badgeDiv.appendChild(span);
  }

  // Stats via RPC (SECURITY DEFINER bypasses RLS para lectura pública)
  const resSug = await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_sugerencias_count`, {
    method: 'POST',
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({ uid: userId })
  });
  document.getElementById('statSugerencias').textContent = (await resSug.json()) ?? '0';

  const resRep = await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_reportes_count`, {
    method: 'POST',
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({ uid: userId })
  });
  document.getElementById('statReportes').textContent = (await resRep.json()) ?? '0';

  // Fecha de registro
  const resFecha = await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_fecha_registro`, {
    method: 'POST',
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({ uid: userId })
  });
  const fechaReg = await resFecha.json();
  if (fechaReg) {
    const fecha = new Date(fechaReg);
    const opciones = { year: 'numeric', month: 'long', day: 'numeric' };
    document.getElementById('riderDesde').textContent = `Rider desde ${fecha.toLocaleDateString('es-CL', opciones)}`;
  }

  document.getElementById('cargando').style.display = 'none';
  document.getElementById('contenido').style.display = 'block';
}

init();
</script>
</body>
</html>
